<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f5f5f3" />
<title>Creative Dprt</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f5f5f7;
    --surface-3: #e8e8ed;

    --line: #e5e5ea;
    --line-2: #d1d1d6;

    --text: #1d1d1f;
    --text-2: #515154;
    --text-3: #86868b;

    --accent: #F6E921;
    --accent-ink: #000000;
    --accent-soft: rgba(246,233,33,.28);
    --ios-blue: #007aff;
    --ios-blue-soft: #eaf2ff;
    --ios-red: #d70015;
    --ios-red-soft: #fff0f0;
    --ios-orange: #c93400;
    --ios-orange-soft: #fff1e7;
    --soft-yellow: #FFF888;
    --soft-green: #90FF88;
    --soft-blue: #88C6FF;
    --soft-purple: #BE88FF;
    --soft-red: #FF888A;

    --col-draft:   #000000;
    --col-goya:    #000000;
    --col-tasdiq:  #000000;
    --col-dizayn:  #000000;
    --col-artdir:  #000000;
    --col-mijoz:   #000000;
    --col-finish:  #000000;
    --col-archive: #000000;

    --prio-urgent: #000000;
    --prio-high:   #000000;
    --prio-normal: #000000;
    --danger: #000000;

    --f-xs: 10.5px;
    --f-sm: 12px;
    --f-md: 13px;
    --f-lg: 14.5px;

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 24px;

    --gut: 16px;
    --nav-h: 56px;
    --nav-gap: 10px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-size: var(--f-lg);
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  a { color: var(--accent); }

  #app {
    height: var(--vh, 100vh);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    padding-bottom: calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 22px);
  }

  #ptr {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    height: 0; overflow: hidden; color: var(--text-3); z-index: 5; pointer-events: none;
  }
  #ptr .ring { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--accent); }
  #ptr.spin .ring { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(140%) blur(16px); -webkit-backdrop-filter: saturate(140%) blur(16px);
    padding: 16px var(--gut) 12px;
    display: flex; align-items: center; gap: 11px;
    border-bottom: 1px solid transparent; transition: border-color 0.2s;
  }
  .topbar.stuck { border-bottom-color: var(--line); }
  .brand-logo { width: 132px; height: auto; filter: invert(1); display: block; margin-right: auto; }
  .topbar .tt { display: none; }
  .topbar h1 {
    font-size: 15px; font-weight: 720; margin: 0; letter-spacing: -0.025em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar .subtitle {
    font-size: var(--f-md); color: var(--text-3); margin: 2px 0 0; line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .topbar .subtitle b { color: var(--text-2); font-weight: 680; }
  .topbar .subtitle .hot { color: var(--danger); font-weight: 680; }

  .icon-btn {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
    transition: transform 0.15s var(--ease), background 0.15s, color 0.15s;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--surface-2); }
  .icon-btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
  .icon-btn.busy svg { animation: spin 0.8s linear infinite; }

  .ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ico-sm { width: 13px; height: 13px; stroke-width: 2; flex: 0 0 auto; }

  .view-in { animation: viewIn 0.22s var(--ease) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- Holat ---------- */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 38px 32px; text-align: center;
  }
  .empty .glyph {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-3);
  }
  .empty .glyph .ico { width: 21px; height: 21px; }
  .empty h3 { margin: 0; font-size: var(--f-lg); font-weight: 600; color: var(--text-2); }
  .empty p { margin: 0; font-size: var(--f-md); color: var(--text-3); line-height: 1.5; max-width: 270px; }
  .empty.ok .glyph { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); background: var(--accent-soft); }
  .empty.error .glyph { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .empty.error h3 { color: var(--danger); }

  /* ---------- Skeleton ---------- */
  .sk { background: var(--surface); border-radius: var(--r-sm); position: relative; overflow: hidden; }
  .sk::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.045), transparent);
    animation: shim 1.3s infinite;
  }
  @keyframes shim { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .sk-card { height: 104px; border-radius: var(--r-md); }

  /* ---------- Home: aniqlik va tez tanlash ---------- */
  .home-intro { padding: 18px var(--gut) 6px; }
  .home-intro h2 { margin: 0; font-family: Georgia, serif; font-size: 40px; font-weight: 400; letter-spacing: -.05em; line-height: 1; }
  .home-intro p { margin: 9px 0 0; color: var(--text-3); font-size: 15px; line-height: 1.35; }
  .focus-strip {
    display: flex; gap: 12px; overflow-x: auto; padding: 14px var(--gut) 2px;
    scrollbar-width: none; scroll-snap-type: x proximity;
  }
  .focus-strip::-webkit-scrollbar { display: none; }
  .focus-card {
    --fc: #f6e921;
    --fc-ink: #111111;
    position: relative; z-index: 0; flex: 0 0 min(78vw, 292px); min-height: 190px; text-align: left;
    border-radius: 0 19px 19px 19px; padding: 15px; scroll-snap-align: start;
    background: var(--fc); color: var(--fc-ink); border: 1px solid color-mix(in srgb, var(--fc-ink) 8%, transparent);
    display: flex; flex-direction: column; transition: transform .12s var(--ease);
  }
  .focus-card::before {
    content: ""; position: absolute; z-index: 0; left: -1px; top: -12px; width: 106px; height: 16px;
    background: var(--fc); border-radius: 14px 14px 0 0; border: 1px solid color-mix(in srgb, var(--fc-ink) 8%, transparent); border-bottom: 0;
  }
  .focus-card > * { position: relative; z-index: 1; }
  .focus-card:active { transform: scale(.975); }
  .focus-top { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
  .focus-state {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px;
    border-radius: 20px; background: rgba(255,255,255,.84); color: var(--fc-ink);
    font-size: var(--f-xs); font-weight: 720;
  }
  .focus-state i { width: 5px; height: 5px; border-radius: 50%; background: var(--sc, #000); }
  .focus-due { color: var(--fc-ink); font-size: var(--f-sm); font-weight: 740; }
  .focus-folder { display: flex; align-items: center; gap: 5px; margin-top: 11px; color: color-mix(in srgb, var(--fc-ink) 68%, transparent); font-size: var(--f-sm); font-weight: 670; }
  .focus-title { margin-top: 17px; font-size: 21px; font-weight: 740; letter-spacing: -0.045em; line-height: 1.1; }
  .focus-owner { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: color-mix(in srgb, var(--fc-ink) 68%, transparent); font-size: var(--f-sm); font-weight: 620; }
  .focus-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 13px; color: color-mix(in srgb, var(--fc-ink) 74%, transparent); font-size: var(--f-sm); }
  .focus-bottom .person { color: color-mix(in srgb, var(--fc-ink) 72%, transparent); }
  .tasks-title { padding: 30px var(--gut) 10px; font-family: Georgia, serif; font-size: 29px; font-weight: 400; letter-spacing: -.05em; }
  .time-tabs { display: flex; gap: 0; padding: 0 var(--gut); overflow-x: auto; scrollbar-width: none; }
  .time-tabs::-webkit-scrollbar { display: none; }
  .time-tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; color: var(--text-3); background: var(--surface-2); border: 0; font-size: var(--f-md); font-weight: 650; margin-right: 2px; }
  .time-tab.on { color: #fff; background: #000; }

  /* ---------- Kalendar paneli ---------- */
  .cal-panel { overflow: hidden; }
  .cal-head { display: flex; align-items: center; gap: 8px; padding: 8px var(--gut) 0; }
  .cal-head .month { flex: 1; font-size: var(--f-sm); font-weight: 640; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.07em; }
  .mini-btn {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    color: var(--text-2); background: var(--surface); border: 1px solid var(--line);
    transition: transform 0.12s var(--ease);
  }
  .mini-btn:active { transform: scale(0.9); }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px var(--gut) 6px; }
  .mdow { font-size: var(--f-xs); color: var(--text-3); text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 2px; }
  .mday {
    aspect-ratio: 1 / 1; border-radius: 11px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 13.5px; font-weight: 580; color: var(--text);
    transition: background 0.15s, transform 0.12s var(--ease);
  }
  .mday:active { transform: scale(0.9); }
  .mday .mdot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .mday.out { color: var(--text-3); opacity: 0.35; }
  .mday.has { background: var(--surface-2); }
  .mday.has .mdot { background: var(--accent); }
  .mday.late { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .mday.late .mdot { background: var(--danger); }
  .mday.today { box-shadow: inset 0 0 0 1px var(--line-2); }
  .mday.today:not(.sel) { color: var(--accent); }
  .mday.sel { background: var(--accent) !important; color: var(--accent-ink) !important; box-shadow: none; }
  .mday.sel .mdot { background: var(--accent-ink) !important; opacity: 0.55; }

  .filter-bar { display: flex; align-items: center; gap: 8px; padding: 6px var(--gut) 0; }
  .fchip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); border-radius: 20px; padding: 6px 9px 6px 12px;
    font-size: var(--f-md); font-weight: 620;
  }
  .fchip .x { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .fchip .x svg { width: 9px; height: 9px; stroke-width: 2.6; }

  /* ---------- Bo'lim sarlavhasi ---------- */
  .sec {
    display: flex; align-items: center; gap: 7px;
    font-size: var(--f-sm); font-weight: 760; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.07em;
    padding: 24px var(--gut) 10px;
  }
  .sec .badge { font-size: var(--f-xs); font-weight: 700; padding: 1.5px 7px; border-radius: 20px; background: var(--surface-2); color: var(--text-2); letter-spacing: 0; }
  .sec .hint { margin-left: auto; font-size: var(--f-xs); font-weight: 600; color: var(--text-3); text-transform: none; letter-spacing: 0; opacity: 0.8; }

  /* ---------- Vazifa kartochkasi ---------- */
  .cards { padding: 0 var(--gut); display: flex; flex-direction: column; gap: 8px; }
  .cards.muted .card { opacity: 0.62; }
  .card {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid rgba(20,20,18,.06);
    border-radius: 15px; padding: 14px;
    transition: transform 0.12s var(--ease), filter 0.15s, opacity 0.2s;
  }
  .card:active { transform: scale(0.985); filter: brightness(1.2); }
  /* Rang faqat prioritet baland bo'lganda - qolgani neytral */
  .card[data-prio="urgent"] { background: #fde9e7; border-color: #f4c8c3; }
  .card[data-prio="high"] { background: #fff7d8; border-color: #f0e2a7; }
  .card-top { display: flex; align-items: flex-start; gap: 9px; }
  .card-title { flex: 1; font-size: 16px; font-weight: 710; line-height: 1.25; letter-spacing: -0.027em; }
  .flag { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 2px; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; fill: none; }
  .flag.p-urgent { color: var(--prio-urgent); fill: color-mix(in srgb, var(--prio-urgent) 30%, transparent); }
  .flag.p-high   { color: var(--prio-high);   fill: color-mix(in srgb, var(--prio-high) 30%, transparent); }
  .flag.p-normal { color: var(--prio-normal); }
  .flag.p-none   { color: var(--text-3); opacity: 0.45; }

  .card-proj {
    font-size: var(--f-md); color: var(--text-3); font-weight: 610; margin-top: 5px;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 10px; margin-top: 8px; font-size: var(--f-md); color: var(--text-3); }
  .card-row .m { display: inline-flex; align-items: center; gap: 4.5px; }
  .m.late { color: var(--danger); font-weight: 640; }
  .m.p-high { color: #957300; font-weight: 660; }
  .m.p-urgent { color: #b74c42; font-weight: 660; }
  .st-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--f-sm); font-weight: 620; padding: 3px 9px 3px 7px;
    border-radius: 20px; color: var(--si, var(--sc)); background: var(--sb, color-mix(in srgb, var(--sc) 13%, white));
  }
  .st-chip i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }

  /* Dizaynerlar - ism bo'yicha, rangli nuqta bilan */
  .people { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; margin-left: auto; }
  .person { display: inline-flex; align-items: center; gap: 6px; font-size: var(--f-md); color: var(--text-2); font-weight: 560; }
  .person i { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
  .person.more { color: var(--text-3); }

  /* ---------- Dizayner: bitta ekran, bitta vazifa ---------- */
  body.designer-mode #app { padding-bottom: calc(28px + var(--safe-b)); }
  body.designer-mode .fab { display: none !important; }
  body.designer-mode .bnav { display:none !important; }
  body.designer-mode .nav-item { flex:1; flex-direction:column; gap:3px; color:var(--text-3); }
  body.designer-mode .nav-item .ico { width:20px; height:20px; }
  body.designer-mode .nav-item .lbl { max-width:90px; opacity:1; font-size:10px; font-weight:560; }
  body.designer-mode .nav-item.active { flex:1; color:var(--text); background:transparent; }
  .my-tasks { padding: 25px var(--gut) 12px; }
  .my-tasks h2 { margin: 0; font-size: 34px; line-height: 1.08; letter-spacing: -.045em; font-weight: 650; }
  .task-group { margin-top: 28px; }
  .task-group-head { display:flex; align-items:center; gap:9px; padding:0 0 12px; font-size:20px; line-height:1.1; letter-spacing:-.032em; font-weight:650; }
  .task-group-head .ico { width:21px; height:21px; color:var(--text-2); stroke-width:1.8; }
  .task-group-head .count { font-size:14px; letter-spacing:0; color:var(--text-2); background:var(--surface-2); padding:4px 8px; border-radius:9px; font-weight:560; }
  .task-group.overdue .task-group-head { color:var(--ios-red); }
  .task-group.overdue .task-group-head .ico { color:var(--ios-red); }
  .task-group.overdue .task-group-head .count { color:var(--ios-red); background:var(--ios-red-soft); }
  .task-group.today .task-group-head .ico { color:#2475ad; }
  .task-group.today .task-group-head .count { color:#2475ad; background:color-mix(in srgb, var(--soft-blue) 45%, white); }
  .task-group.upcoming .task-group-head .ico { color:#287a2c; }
  .task-group.upcoming .task-group-head .count { color:#287a2c; background:color-mix(in srgb, var(--soft-green) 48%, white); }
  .task-group.rush .task-group-head { color:var(--text); }
  .task-group.rush .task-group-head .ico { color:#9b8b00; }
  .task-group.rush .task-group-head .count { color:var(--text); background:color-mix(in srgb, var(--soft-yellow) 55%, white); }
  .quick-strip { display:flex; gap:10px; overflow-x:auto; margin:0 calc(var(--gut) * -1); padding:12px var(--gut) 2px; scrollbar-width:none; }
  .quick-strip::-webkit-scrollbar { display:none; }
  .quick-task { --folder-bg:var(--soft-yellow); --folder-ink:#151512; position:relative; z-index:0; flex:0 0 174px; min-height:156px; padding:14px; text-align:left; border-radius:0 16px 16px 16px; background:var(--folder-bg); color:var(--folder-ink); border:1px solid color-mix(in srgb, var(--folder-ink) 15%, transparent); display:flex; flex-direction:column; overflow:visible; }
  .quick-task::before { content:""; position:absolute; z-index:1; top:-11px; left:-1px; width:96px; height:14px; border-radius:14px 14px 0 0; background:var(--folder-bg); border:1px solid color-mix(in srgb, var(--folder-ink) 15%, transparent); border-bottom:0; }
  .quick-task > * { position:relative; z-index:2; }
  .quick-status { display:inline-flex; align-items:center; gap:4px; align-self:flex-start; padding:4px 8px; border-radius:99px; background:color-mix(in srgb, white 82%, transparent); font-size:11px; font-weight:630; }
  .quick-status i { width:5px; height:5px; border-radius:50%; background:currentColor; }
  .quick-status .ico { width:13px; height:13px; }
  .quick-name { margin-top:15px; color:var(--folder-ink); font-size:16px; line-height:1.18; font-weight:650; letter-spacing:-.03em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .quick-project { display:flex; align-items:center; gap:4px; margin-top:9px; color:color-mix(in srgb, var(--folder-ink) 76%, transparent); font-size:12px; font-weight:560; }
  .quick-project .ico { width:14px; height:14px; }
  .quick-meta { margin-top:auto; padding-top:10px; color:color-mix(in srgb, var(--folder-ink) 80%, transparent); font-size:12px; font-weight:620; }
  .designer-list { display:flex; flex-direction:column; gap:9px; }
  .designer-task { display:flex; align-items:flex-start; gap:13px; padding:15px; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
  .task-group.today .designer-task { background:var(--soft-blue); border-color:color-mix(in srgb, var(--soft-blue) 68%, #347aa6); }
  .task-group.upcoming .designer-task { background:var(--soft-green); border-color:color-mix(in srgb, var(--soft-green) 68%, #3d7b3d); }
  .task-group.today .designer-chip, .task-group.upcoming .designer-chip { background:color-mix(in srgb, white 64%, transparent); color:var(--text-2); }
  .task-group.today .task-check, .task-group.upcoming .task-check { border-color:color-mix(in srgb, #000 35%, transparent); }
  .task-check { width:27px; height:27px; border-radius:50%; border:1.5px solid var(--line-2); flex:0 0 auto; margin-top:1px; transition:background .15s, border-color .15s, transform .12s var(--ease); }
  .task-check:active { transform:scale(.87); }
  .task-check.done { background:#000; border-color:#000; color:#fff; display:grid; place-items:center; }
  .task-check .ico { display:none; width:15px; height:15px; stroke-width:2.5; }
  .task-check.done .ico { display:block; }
  .designer-task-main { min-width:0; flex:1; text-align:left; }
  .designer-task-name { font-size:17px; font-weight:560; letter-spacing:-.028em; line-height:1.28; }
  .designer-task-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:8px; }

  .lightbox { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,.94); display: none; flex-direction: column; padding: calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b)); }

  .lightbox-top { display: flex; justify-content: flex-end; padding-bottom: 8px; }
  .lightbox .icon-btn { background: rgba(255,255,255,.14); border: 0; color: #fff; }
  .lightbox-stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: auto; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }

  /* Forma */
  .form { padding: 14px var(--gut) 0; display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: var(--f-sm); font-weight: 680; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
  .field label .req { color: var(--danger); }
  .input, .select, .ta {
    width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: var(--r-sm); padding: 12px 13px; font-size: var(--f-lg); font-family: inherit;
    appearance: none; -webkit-appearance: none;
  }
  .input:focus, .select:focus, .ta:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .ta { resize: none; line-height: 1.4; }
  .select { background-image: none; }
  .select option { background: var(--surface-2); color: var(--text); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 20px; padding: 7px 12px; font-size: var(--f-md); font-weight: 580;
    transition: transform 0.12s var(--ease);
  }
  .chip:active { transform: scale(0.95); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--text); }
  .chip.p.on[data-p="Urgent 🔥"] { background: color-mix(in srgb, var(--prio-urgent) 16%, transparent); border-color: color-mix(in srgb, var(--prio-urgent) 45%, transparent); color: var(--prio-urgent); }
  .chip.p.on[data-p="High 🥵"] { background: color-mix(in srgb, var(--prio-high) 16%, transparent); border-color: color-mix(in srgb, var(--prio-high) 45%, transparent); color: var(--prio-high); }
  .form-err { color: var(--danger); font-size: var(--f-md); padding: 0 var(--gut); }

  /* ---------- Pastki panel (holat tanlash) ---------- */
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.22s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 81;
    background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; border-top: 1px solid var(--line-2);
    padding: 8px var(--gut) calc(16px + var(--safe-b));
    transform: translateY(101%); transition: transform 0.28s var(--ease);
    max-height: 80%; overflow-y: auto;
  }
  .sheet.open { transform: none; }
  .grab { width: 34px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 2px auto 12px; }
  .sheet h3 { font-size: var(--f-sm); font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 10px; }
  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px 12px; border-radius: var(--r-sm); font-size: var(--f-lg); font-weight: 580;
    transition: background 0.14s;
  }
  .opt:active { background: var(--surface-2); }
  .opt i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .opt .ck { margin-left: auto; color: var(--accent); }
  .opt[disabled] { opacity: 0.4; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 22px);
    transform: translate(-50%, 14px); z-index: 90;
    background: var(--surface-3); border: 1px solid var(--line-2); color: var(--text);
    padding: 10px 16px; border-radius: 20px; font-size: var(--f-md); font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s var(--ease);
    max-width: calc(100% - 40px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }

  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>

<script>
const tg = window.Telegram?.WebApp;
const BG = "#ffffff";

/* ==================== Telegram ==================== */
function haptic(s) { try { tg?.HapticFeedback?.impactOccurred(s || "light"); } catch (e) {} }
function hapticSelect() { try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {} }
function hapticNotify(t) { try { tg?.HapticFeedback?.notificationOccurred(t || "success"); } catch (e) {} }

function syncViewport() {
  const h = tg?.viewportStableHeight || window.innerHeight;
  document.documentElement.style.setProperty("--vh", h + "px");
}
(function initTelegram() {
  if (!tg) { syncViewport(); return; }
  tg.ready(); tg.expand();
  try { tg.setHeaderColor(BG); } catch (e) {}
  try { tg.setBackgroundColor(BG); } catch (e) {}
  try { tg.setBottomBarColor(BG); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
  tg.onEvent("viewportChanged", syncViewport);
  syncViewport();
})();
window.addEventListener("resize", syncViewport);

/* ==================== Doimiylar ==================== */
// Notion option `color` qiymatini yumshoq, o'qilishi oson UI ranglariga o'tkazamiz.
const NOTION_COLORS = {
  default: { bg: "#f3f3f1", ink: "#555550", dot: "#73736c" },
  gray:    { bg: "#efefed", ink: "#5d5d57", dot: "#777770" },
  brown:   { bg: "#f4eee8", ink: "#795c47", dot: "#9a7356" },
  orange:  { bg: "#fcead9", ink: "#a3591d", dot: "#d17a2c" },
  yellow:  { bg: "#fff5cc", ink: "#8b6a00", dot: "#b68b00" },
  green:   { bg: "#e5f2e8", ink: "#39704a", dot: "#559565" },
  blue:    { bg: "#e3effa", ink: "#356d9d", dot: "#548fbe" },
  purple:  { bg: "#f0e9f7", ink: "#725592", dot: "#9676b8" },
  pink:    { bg: "#fae8ef", ink: "#9d4d6a", dot: "#c77996" },
  red:     { bg: "#fbe8e6", ink: "#a64c42", dot: "#d87669" },
};
const PRIO = {
  "Urgent 🔥": { key: "urgent", label: "Urgent", rank: 0 },
  "High 🥵":   { key: "high",   label: "High",   rank: 1 },
  "Normal":    { key: "normal", label: "Normal", rank: 2 },
};
const DONE_STATUSES = ["Finish", "Archive"];
const STATUS_PROGRESS = {
  "Draft": 10,
  "G'oya kerak": 20,
  "Tasdiqlanyapti": 35,
  "Dizaynda": 55,
  "Art direktorda": 78,
  "Mijozda": 90,
  "Finish": 100,
  "Archive": 100,
};
// Kimning navbati: dizaynerda ish turgan bosqichlar / art direktorda turgan bosqichlar
const COURT_DESIGNER = ["Draft", "G'oya kerak", "Dizaynda"];
const COURT_MANAGER = ["Art direktorda", "Tasdiqlanyapti"];

const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
const MON_SHORT = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
const DOW_MIN = ["Du","Se","Ch","Pa","Ju","Sh","Ya"];
const AV_COLORS = ["#000000"];
const PROJECT_TONES = ["#F6E921"];

/* ==================== Holat ==================== */
let boardData = null, metaData = null;
let currentNav = "home";
let currentStatus = null, currentAgencyTab = "about";
let dateFilter = null;          // tanlangan kun (Date) yoki null
let homeStatusFilter = "all";  // Home: Notion statusiga asoslangan filtr
let designerDateOffset = 0;
let calOpen = false;
let monthCursor = null;
let overlayStack = [];

const $ = (id) => document.getElementById(id);
const appEl = $("app"), viewEl = $("view");

/* ==================== Yordamchilar ==================== */
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayMidnight() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function parseDate(s) { if (!s) return null; const d = new Date(s); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function deadlineLabel(dl, today) {
  const n = daysBetween(today, dl);
  if (n === 0) return "Bugun";
  if (n === 1) return "Ertaga";
  if (n === -1) return "Kecha kechikdi";
  if (n < -1) return Math.abs(n) + " kun kechikdi";
  if (n <= 6) return n + " kundan keyin";
  return dl.getDate() + " " + MON_SHORT[dl.getMonth()];
}
function fullDate(d) { return d.getDate() + " " + MONTHS[d.getMonth()].toLowerCase(); }
function isActive(t) { return !DONE_STATUSES.includes(t.status); }
function statusStyle(status) {
  const option = boardData?.statusOptions?.find((x) => x.name === status);
  return NOTION_COLORS[option?.color || "default"] || NOTION_COLORS.default;
}
function statusColor(status) { return statusStyle(status).dot; }
function statusChipHtml(status) {
  const style = statusStyle(status);
  return `<span class="st-chip" style="--sc:${style.dot};--sb:${style.bg};--si:${style.ink}"><i></i>${escapeHtml(status)}</span>`;
}
function prioOf(t) { return t.prioritet ? PRIO[t.prioritet] : null; }
function initials(n) {
  const p = String(n || "").trim().split(/\s+/).filter(Boolean);
  if (!p.length) return "?";
  return (p.length === 1 ? p[0].slice(0,2) : p[0][0] + p[1][0]).toUpperCase();
}
function personColor(name) {
  let h = 0; const s = String(name);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function projectTone(name) {
  let h = 0; const s = String(name || "Creative Dprt");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PROJECT_TONES[h % PROJECT_TONES.length];
}
function greeting() {
  const h = new Date().getHours();
  return h < 6 ? "Xayrli tun" : h < 12 ? "Xayrli tong" : h < 18 ? "Xayrli kun" : "Xayrli kech";
}
function isManager() { return !!boardData?.requester?.isManager; }

// Ushbu rol uchun "navbat menda" hisoblanadigan bosqichlar
function courtStatuses() {
  const all = boardData.statusOrder || [];
  const want = isManager() ? COURT_MANAGER : COURT_DESIGNER;
  const hit = want.filter((s) => all.includes(s));
  return hit.length ? hit : all.filter((s) => !DONE_STATUSES.includes(s));
}
function inMyCourt(t) { return courtStatuses().includes(t.status); }

// Kechikkanlar oldinda, keyin muddat bo'yicha, muddatsizlar oxirida
function urgencySort(a, b) {
  const today = todayMidnight();
  const da = parseDate(a.dedlayn), db = parseDate(b.dedlayn);
  const la = da && da < today, lb = db && db < today;
  if (la !== lb) return la ? -1 : 1;
  if (!da && !db) return (prioOf(a)?.rank ?? 3) - (prioOf(b)?.rank ?? 3);
  if (!da) return 1;
  if (!db) return -1;
  if (+da !== +db) return da - db;
  return (prioOf(a)?.rank ?? 3) - (prioOf(b)?.rank ?? 3);
}

let toastTimer = null;
function toast(msg, isErr) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ==================== API ==================== */
const qs = new URLSearchParams(location.search);
const isDemo = qs.get("demo") === "1";
const demoRole = qs.get("role") || "designer";
const devUsername = qs.get("username") || "";

function apiUrl(path) {
  if (!devUsername) return path;
  return path + (path.includes("?") ? "&" : "?") + "username=" + encodeURIComponent(devUsername);
}

async function api(path, opts) {
  opts = opts || {};
  if (isDemo) return demoApi(path, opts);

  const headers = {};
  if (tg?.initData) headers["x-telegram-init-data"] = tg.initData;
  if (opts.body) headers["Content-Type"] = "application/json";

  const resp = await fetch(apiUrl(path), {
    method: opts.method || "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await resp.json(); } catch (e) {}
  if (!resp.ok) { const e = new Error(data.error || "Xatolik yuz berdi"); e.status = resp.status; throw e; }
  return data;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function demoApi(path, opts) {
  if (!window.DEMO) await loadScript("/demo-data.js");
  await new Promise((r) => setTimeout(r, 180)); // tarmoq kechikishini taqlid qilamiz
  const D = window.DEMO;
  if (path.startsWith("/api/board")) return D.board(demoRole);
  if (path.startsWith("/api/meta")) return D.meta();
  if (path.startsWith("/api/content/")) {
    const resp = await fetch(path);
    if (!resp.ok) throw new Error("Topilmadi");
    return resp.json();
  }
  const mStatus = path.match(/^\/api\/task\/([^/]+)\/status$/);
  if (mStatus) return D.setStatus(mStatus[1], opts.body.status);
  const mTask = path.match(/^\/api\/task\/([^/]+)$/);
  if (mTask) { const r = D.task(mTask[1]); if (!r) throw new Error("Topilmadi"); return r; }
  if (path === "/api/tasks" && opts.method === "POST") return D.create(opts.body);
  throw new Error("Noma'lum so'rov");
}

let refreshing = false;
async function refresh(fromPtr) {
  if (refreshing) return;
  refreshing = true;
  const btn = $("refresh-btn");
  btn.classList.add("busy");
  haptic("light");
  await loadData(true);
  btn.classList.remove("busy");
  refreshing = false;
  if (fromPtr) haptic("medium");
}
$("refresh-btn").onclick = () => refresh(false);

(function ptrSetup() {
  const ptr = $("ptr");
  let startY = 0, pulling = false, dist = 0;
  appEl.addEventListener("touchstart", (e) => {
    if (appEl.scrollTop <= 0 && !overlayStack.length) { startY = e.touches[0].clientY; pulling = true; dist = 0; }
  }, { passive: true });
  appEl.addEventListener("touchmove", (e) => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0) { ptr.style.height = "0px"; return; }
    const h = Math.min(dist * 0.45, 74);
    ptr.style.height = h + "px";
    const r = ptr.querySelector(".ring");
    r.style.opacity = Math.min(h / 34, 1);
    r.style.transform = `rotate(${h * 6}deg)`;
  }, { passive: true });
  appEl.addEventListener("touchend", async () => {
    if (!pulling) return;
    pulling = false;
    if (dist >= 66) { ptr.classList.add("spin"); ptr.style.height = "44px"; await refresh(true); ptr.classList.remove("spin"); }
    ptr.style.height = "0px";
    ptr.querySelector(".ring").style.transform = "";
  });
})();

  hapticSelect();

/* ==================== HOME ==================== */
function renderDesignerHome() {
  const today = todayMidnight();
  const me = boardData.requester?.id;
  // Dizayner uchun "mening" degani: unga biriktirilgan barcha faol tasklar.
  const mine = boardData.tasks.filter((t) => isActive(t) && t.designers.some((d) => d.id === me)).sort(urgencySort);
  const overdue = mine.filter((t) => { const d = parseDate(t.dedlayn); return d && d < today; });
  const rush = mine.filter((t) => overdue.includes(t) || ["urgent", "high"].includes(prioOf(t)?.key)).slice(0, 6);
  const selectedDate = new Date(today);
  selectedDate.setDate(today.getDate() + designerDateOffset);
  const visibleTasks = mine.filter((t) => {
    const d = parseDate(t.dedlayn);
    return d && ymd(d) === ymd(selectedDate) && !rush.includes(t);
  });

  setHeader("Creative Dprt", "");
  let html = `<section class="my-tasks"><h2>Mening<br>topshiriqlarim</h2>`;
  html += rush.length ? `<section class="task-group rush"><div class="task-group-head"><svg class="ico"><use href="#i-alert"/></svg>Tezroq kerak<span class="count">${rush.length}</span></div><div class="quick-strip">${rush.map((t) => quickTaskHtml(t, today)).join("")}</div></section>` : "";
  html += designerDateStripHtml(today);
  html += `<h3 class="today-heading">${designerDateOffset === 0 ? "Bugungi topshiriqlar" : escapeHtml(fullDate(selectedDate) + " topshiriqlari")}</h3>`;
  html += `<div class="planner-list">${visibleTasks.length ? visibleTasks.map((t) => designerTaskHtml(t, today)).join("") : `<div class="planner-empty">Bu kun uchun topshiriq yo‘q.</div>`}</div>`;
  if (!mine.length) html += `<div class="designer-empty">Hozir sizga biriktirilgan faol topshiriq yo‘q.</div>`;
  html += `</section>`;

  viewEl.innerHTML = `<div class="view-in">${html}</div>`;
  viewEl.querySelectorAll("[data-designer-task]").forEach((el) => {
    el.onclick = () => openDetail(el.dataset.designerTask);
  });
  viewEl.querySelectorAll("[data-complete]").forEach((el) => {
    el.onclick = (event) => { event.stopPropagation(); completeTask(el.dataset.complete); };
  });
  viewEl.querySelectorAll("[data-day-offset]").forEach((el) => {
    el.onclick = () => { designerDateOffset = Number(el.dataset.dayOffset); hapticSelect(); renderDesignerHome(); };
  });
  viewEl.querySelectorAll("[data-toggle-group]").forEach((el) => {
    el.onclick = () => {
      const group = $(el.dataset.toggleGroup);
      const collapsed = group.classList.toggle("collapsed");
      el.setAttribute("aria-expanded", String(!collapsed));
      hapticSelect();
    };
  });
}

  return `<div class="date-strip">${[-2, -1, 0, 1, 2].map((offset) => {
    const date = new Date(today);
    date.setDate(today.getDate() + offset);
    return `<button class="date-chip${designerDateOffset === offset ? " on" : ""}" data-day-offset="${offset}"><span>${labels[date.getDay()]}</span><b>${date.getDate()}</b></button>`;

function designerGroupHtml(title, icon, tasks, today, kind) {
  if (!tasks.length) return "";
  const id = `designer-group-${kind}`;
  const toggle = kind === "upcoming" ? `<button class="group-toggle" data-toggle-group="${id}" aria-label="Keyingi topshiriqlarni yig'ish" aria-expanded="true"><svg class="ico"><use href="#i-down"/></svg></button>` : "";
  return `<section class="task-group ${kind}" id="${id}">
      <div class="task-group-head"><svg class="ico"><use href="#${icon}"/></svg>${title}<span class="count">${tasks.length}</span>${toggle}</div>
      <div class="designer-list">${tasks.map((t) => designerTaskHtml(t, today)).join("")}</div>
    </section>`;
}

function designerTaskHtml(t, today) {
  const dl = parseDate(t.dedlayn);
  const late = dl && dl < today;
  const p = prioOf(t);
  const deadline = dl ? `<span class="designer-chip ${late ? "late" : ""}"><svg class="ico"><use href="#i-cal-fill"/></svg>${escapeHtml(deadlineLabel(dl, today))}</span>` : "";
  const priority = p && p.key !== "normal" ? `<span class="designer-chip p-${p.key}"><svg class="ico"><use href="#i-flag"/></svg>${escapeHtml(p.label)}</span>` : "";
  const project = t.projectName ? `<span class="designer-chip"><svg class="ico"><use href="#i-folder-fill"/></svg>${escapeHtml(t.projectName)}</span>` : "";
  return `<div class="designer-task">
      <button class="task-check" data-complete="${escapeHtml(t.id)}" aria-label="${escapeHtml(t.name)} tugallandi deb belgilash"><svg class="ico"><use href="#i-tick"/></svg></button>
      <button class="designer-task-main" data-designer-task="${escapeHtml(t.id)}">
        <div class="designer-task-name">${escapeHtml(t.name)}</div>
        <div class="designer-task-meta">${deadline}${priority}${project}</div>
      </button>
    </div>`;
}

async function completeTask(id) {
  const task = boardData.tasks.find((t) => t.id === id);
  const doneStatus = boardData.statusOrder.find((s) => s === "Finish") || "Finish";
  if (!task) return;
  const previous = task.status;
  task.status = doneStatus;
  rebuildBoard(); renderDesignerHome();
  try {
    await api(`/api/task/${encodeURIComponent(id)}/status`, { method: "PATCH", body: { status: doneStatus } });
    hapticNotify("success"); toast("Topshiriq tugallandi");
  } catch (err) {
    task.status = previous;
    rebuildBoard(); renderDesignerHome();
    hapticNotify("error"); toast(err.message || "O'zgartirib bo'lmadi", true);
  }
}

function renderHome() {
  if (!isManager()) { renderDesignerHome(); return; }
  renderManagerHome(); return;
  const today = todayMidnight();
  const active = boardData.tasks.filter(isActive);
  const mine = active.filter(inMyCourt).sort(urgencySort);
  const waiting = active.filter((t) => !inMyCourt(t)).sort(urgencySort);
  const lateMine = mine.filter((t) => { const d = parseDate(t.dedlayn); return d && d < today; });

  // Header faqat kontekst beradi; asosiy ekran nomi pastda katta ko'rinadi.
  let sub;
  if (dateFilter) {
    sub = `${escapeHtml(fullDate(dateFilter))} kuni bo'yicha filtr`;
  } else if (!mine.length) {
    sub = isManager() ? "Tekshiruvda ish yo'q — jamoa ishlayapti" : "Navbatingizda ish yo'q";
  } else {
    const what = isManager() ? "tekshiruvda" : "ish sizda";
    sub = `<b>${mine.length}</b> ta ${what}`
      + (lateMine.length ? ` · <span class="hot">${lateMine.length} kechikkan</span>` : "");
  }
  setHeader("Creative Dprt", sub);

  $("cal-toggle").classList.toggle("on", calOpen || !!dateFilter);

  let html = `<section class="home-intro">
      <h2>Vazifalar</h2>
      <p>${isManager() ? "Jamoa oqimi va tekshiruv navbati" : "Bugun yakunlashingiz kerak bo'lgan ishlar"}</p>
    </section>`;

  // Kalendar - yopiq turadi, fokusga halal bermaydi
  if (calOpen) {
    const byDay = {};
    active.forEach((t) => { const d = parseDate(t.dedlayn); if (d) (byDay[ymd(d)] = byDay[ymd(d)] || []).push(t); });
    html += `<div class="cal-panel view-in">
        <div class="cal-head">
          <button class="mini-btn" id="m-prev"><svg class="ico ico-sm"><use href="#i-left"/></svg></button>
          <span class="month">${MONTHS[monthCursor.getMonth()]} ${monthCursor.getFullYear()}</span>
          <button class="mini-btn" id="m-next"><svg class="ico ico-sm"><use href="#i-right"/></svg></button>
        </div>
        ${monthGridHtml(byDay, today)}
      </div>`;
  }

  if (dateFilter) {
    html += `<div class="filter-bar">
        <button class="fchip" id="clear-filter">
          <svg class="ico ico-sm"><use href="#i-cal"/></svg>${escapeHtml(fullDate(dateFilter))}
          <span class="x"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        </button>
      </div>`;

    const dayTasks = active.filter((t) => { const d = parseDate(t.dedlayn); return d && ymd(d) === ymd(dateFilter); }).sort(urgencySort);
    html += `<div class="sec">Shu kundagi ishlar <span class="badge">${dayTasks.length}</span></div>`;
    html += dayTasks.length
      ? `<div class="cards">${dayTasks.map(cardHtml).join("")}</div>`
      : emptyHtml("i-check", "Bo'sh kun", "Bu kunga muddat belgilangan ish yo'q.", true);

    viewEl.innerHTML = `<div class="view-in">${html}</div>`;
    bindHome();
    return;
  }

  // Diqqat kerak: avval kechikkanlar, keyin bugungi deadline. Bir nechta bo'lsa surib ko'riladi.
  const spotlight = mine.filter((t) => {
    const d = parseDate(t.dedlayn);
    return d && d <= today;
  }).slice(0, 8);
  if (spotlight.length) {
    html += `<div class="focus-strip">${spotlight.map((t) => focusCardHtml(t, today)).join("")}</div>`;
  }

  // Filtrlar Notion'dagi mavjud statuslardan tuziladi.
  const statuses = boardData.statusOrder.filter((status) => mine.some((t) => t.status === status));
  const tabs = [["all", "Hammasi"], ...statuses.map((status) => [status, status])];
  html += `<div class="tasks-title">Topshiriqlar</div>`;
  html += `<div class="time-tabs">${tabs.map(([key, label]) =>
    `<button class="time-tab${homeStatusFilter === key ? " on" : ""}" data-home-status="${escapeHtml(key)}">${escapeHtml(label)}</button>`).join("")}</div>`;

  const matchesStatus = mine.filter((t) => homeStatusFilter === "all" || t.status === homeStatusFilter);
  // “Hammasi”da fokus kartasi takrorlanmaydi; aniq status filtrida esa u topilishi mumkin.
  const listTasks = homeStatusFilter === "all" ? matchesStatus.filter((t) => !spotlight.includes(t)) : matchesStatus;
  if (listTasks.length) html += `<div class="cards">${listTasks.map(cardHtml).join("")}</div>`;
  else if (!spotlight.length || homeStatusFilter !== "all") html += emptyHtml("i-check", "Bu bo'limda ish yo'q", "Boshqa statusni tanlab ko'ring.", true);

  // --- Kutilmoqda (boshqada turgan ishlar) ---
  if (waiting.length) {
    const wLabel = isManager() ? "Jamoada" : "Kutilmoqda";
    const wHint = isManager() ? "dizaynerlarda va mijozda" : "sizdan chiqib ketgan";
    html += `<div class="sec">${wLabel} <span class="badge">${waiting.length}</span><span class="hint">${wHint}</span></div>
      <div class="cards muted">${waiting.map(cardHtml).join("")}</div>`;
  }

  viewEl.innerHTML = `<div class="view-in">${html}</div>`;
  bindHome();
}

function emptyHtml(icon, title, text, ok) {
  return `<div class="empty ${ok ? "ok" : ""}">
      <div class="glyph"><svg class="ico"><use href="#${icon}"/></svg></div>
      <h3>${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p>
    </div>`;
}

function taskMatchesTime(t, filter, today) {
  if (filter === "all") return true;
  const d = parseDate(t.dedlayn);
  if (!d) return false;
  const delta = daysBetween(today, d);
  if (filter === "today") return delta === 0;
  if (filter === "tomorrow") return delta === 1;
  return delta >= 0 && delta <= 7;
}

      <div class="focus-top">
        <span class="focus-state"><i></i>${escapeHtml(t.status)}</span>
      </div>

      <div class="focus-owner"><svg class="ico ico-sm"><use href="#i-user"/></svg>${escapeHtml(designer)}</div>
      <div class="focus-bottom"><span>${escapeHtml(deadlineLabel(dl, today))}</span><svg class="ico ico-sm"><use href="#i-right"/></svg></div>
    </button>`;
}

function monthGridHtml(byDay, today) {
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
  const lastRow = new Date(start); lastRow.setDate(start.getDate() + 35);
  const total = lastRow.getMonth() === m ? 42 : 35;

  let cells = DOW_MIN.map((d) => `<div class="mdow">${d}</div>`).join("");
  for (let i = 0; i < total; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const items = byDay[key] || [];
    const cls = ["mday",
      d.getMonth() !== m ? "out" : "",
      items.length ? (d < today ? "late" : "has") : "",
      key === ymd(today) ? "today" : "",
      dateFilter && key === ymd(dateFilter) ? "sel" : "",
    ].filter(Boolean).join(" ");

function cardHtml(t) {
  const today = todayMidnight();
  const dl = parseDate(t.dedlayn);

  const p = prioOf(t);
  const pKey = p ? p.key : "none";

  if (p) row.push(`<span class="m p-${pKey}"><svg class="ico ico-sm"><use href="#i-flag"/></svg>${escapeHtml(p.label)}</span>`);

  let people = "";
  if (isManager() && t.designers.length) {
    const shown = t.designers.slice(0, 2).map((d) =>
      `<span class="person"><i style="background:${personColor(d.name)}"></i>${escapeHtml(d.name)}</span>`).join("");
    const more = t.designers.length > 2 ? `<span class="person more">+${t.designers.length - 2}</span>` : "";
    people = `<span class="people">${shown}${more}</span>`;

  return `<button class="card" data-task="${escapeHtml(t.id)}" data-prio="${pKey}">
      <div class="card-top">

  }).join("");

    const n = boardData.board[s]?.length || 0;
    return `<button class="seg${s === currentStatus ? " active" : ""}" style="--sc:${statusColor(s)}" data-status="${escapeHtml(s)}">
        <i></i>${escapeHtml(s)}<span class="count">${n}</span></button>`;

  });
  const segsEl = $("segs"), act = segsEl.querySelector(".seg.active");
  if (act) segsEl.scrollLeft = act.offsetLeft - segsEl.clientWidth / 2 + act.offsetWidth / 2;

  const tasks = (boardData.board[currentStatus] || []).slice().sort(urgencySort);
  const el = $("task-cards");
  el.innerHTML = tasks.length
    ? `<div class="cards view-in">${tasks.map(cardHtml).join("")}</div>`
      + (list.length > 1 ? `<div class="swipe-hint">← bosqichlar orasida suring →</div>` : "")
    : emptyHtml("i-inbox", "Bo'sh bosqich", `«${currentStatus}» bosqichida hozircha ish yo'q.`);

  el.querySelectorAll("[data-task]").forEach((c) => { c.onclick = () => openDetail(c.dataset.task); });
  bindStatusSwipe(list);
}

function bindStatusSwipe(list) {
  let x0 = 0, y0 = 0, on = false;
  const el = $("task-cards");
  el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; on = true; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (!on) return;
    on = false;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    const i = list.indexOf(currentStatus), n = dx < 0 ? i + 1 : i - 1;
    if (n < 0 || n >= list.length) return;
    currentStatus = list[n]; haptic("light"); renderTasks();
  });
}

/* Notion bloklarini HTML'ga - ketma-ket ro'yxatlarni bitta <ul>/<ol> ga yig'amiz */
function rt(segs) {
  return (segs || []).map((s) => {
    let t = escapeHtml(s.t);
    if (s.c) t = `<code>${t}</code>`;
    if (s.b) t = `<b>${t}</b>`;
    if (s.i) t = `<i>${t}</i>`;
    if (s.s) t = `<s>${t}</s>`;
    if (s.u) t = `<u>${t}</u>`;
    if (s.href) t = `<a href="${escapeHtml(safeUrl(s.href))}" target="_blank" rel="noopener">${t}</a>`;
    return t;
  }).join("");
}

function safeUrl(value) {
  if (!value) return "#";
  try {
    const u = new URL(value, location.origin);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : "#";
  } catch (_) { return "#"; }
}

function urlHost(value) {
  try { return new URL(value, location.origin).hostname.replace(/^www\./, "") || "Havola"; }
  catch (_) { return "Havola"; }
}

function fileCardHtml(url, title, icon) {
  const href = safeUrl(url);
  return `<a class="n-file" href="${escapeHtml(href)}" target="_blank" rel="noopener">
      <span class="file-ico"><svg class="ico"><use href="#${icon || "i-file"}"/></svg></span>
      <span class="file-copy"><span class="file-title">${escapeHtml(title || "Fayl")}</span><span class="file-host">${escapeHtml(urlHost(href))}</span></span>
      <svg class="ico ico-sm file-arrow"><use href="#i-right"/></svg>
    </a>`;
}

function calloutTone(emoji) {
  if (["⚠️", "❗", "⛔", "🚫"].includes(emoji)) return "warn";
  if (["ℹ️", "💡", "🔵"].includes(emoji)) return "info";
  return "";
}

function renderBlocks(blocks) {
  let out = "", list = null, buf = [];
  const flush = () => {
    if (!list) return;
    out += `<${list}>${buf.join("")}</${list}>`;
    list = null; buf = [];
  };

  for (const b of blocks) {
    const kids = b.children?.length ? `<div class="n-sub">${renderBlocks(b.children)}</div>` : "";

    if (b.type === "bulleted_list_item" || b.type === "numbered_list_item") {
      const want = b.type === "bulleted_list_item" ? "ul" : "ol";
      if (list !== want) { flush(); list = want; }
      const itemText = rt(b.text);
      buf.push(`<li>${itemText || "&nbsp;"}${kids}</li>`);
      continue;
    }
    flush();

    switch (b.type) {
      case "heading_1": out += `<div class="n-h1">${rt(b.text)}</div>`; break;
      case "heading_2": out += `<div class="n-h2">${rt(b.text)}</div>`; break;
      case "heading_3": out += `<div class="n-h3">${rt(b.text)}</div>`; break;
      case "paragraph": {
        const inner = rt(b.text);
        if (inner.trim()) out += `<p>${inner}</p>`;
        break;
      }
      case "to_do":
        out += `<div class="n-todo ${b.checked ? "done" : ""}">
            <span class="box">${b.checked ? `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.4l4.6 4.6L19 7.4"/></svg>` : ""}</span>
            <span class="t">${rt(b.text)}</span></div>`;
        break;
      case "quote": out += `<blockquote>${rt(b.text)}</blockquote>`; break;
      case "callout":
        out += `<div class="n-callout ${calloutTone(b.emoji)}">${b.emoji ? `<span class="e">${escapeHtml(b.emoji)}</span>` : ""}<span>${rt(b.text)}</span></div>`;
        break;
      case "code": out += `<pre><code>${escapeHtml((b.text || []).map((s) => s.t).join(""))}</code></pre>`; break;
      case "divider": out += `<hr>`; break;
      case "image":
        if (b.url) {
          const imageUrl = safeUrl(b.url), cap = rt(b.caption), capText = (b.caption || []).map((s) => s.t).join("");
          out += `<button class="n-image" data-image="${escapeHtml(imageUrl)}" data-caption="${escapeHtml(capText)}" aria-label="Rasmni kattalashtirish"><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(capText)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></button>`
            + (cap ? `<div class="n-cap">${cap}</div>` : "");
        }
        break;
      case "bookmark": case "embed": case "link_preview":
        if (b.url) out += fileCardHtml(b.url, (b.caption || []).map((s) => s.t).join("") || urlHost(b.url), "i-ext");
        break;
      case "file": case "pdf": case "video":
        if (b.url) out += fileCardHtml(b.url, b.name || (b.type === "video" ? "Video" : b.type === "pdf" ? "PDF hujjat" : "Fayl"), "i-file");
        break;
      case "toggle":
        out += `<details class="n-toggle"><summary>${rt(b.text)}</summary>${kids}</details>`;
        continue;
      case "container":
        out += kids;
        continue;
      case "child_page":
        out += `<div class="n-file"><svg class="ico ico-sm"><use href="#i-file"/></svg>${rt(b.text)}</div>`;
        break;
      default: break;
    }
    out += kids;
  }
  flush();
  return out;
}

      </div>
      <div class="field">
        <label>Loyiha</label>
        <select class="select" id="f-project">
          <option value="">— tanlanmagan —</option>
          ${projects.map((p)=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Dizaynerlar</label>
        <div class="chips" id="f-people">
          ${people.map((d)=>`<button class="chip" data-id="${escapeHtml(d.id)}"><i style="background:${personColor(d.name)}"></i>${escapeHtml(d.name)}</button>`).join("")}
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Muddat</label>
          <input class="input" type="date" id="f-date">
        </div>
        <div class="field">
          <label>Bosqich</label>
          <select class="select" id="f-status">
            ${statuses.map((s)=>`<option value="${escapeHtml(s)}"${s===form.status?" selected":""}>${escapeHtml(s)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Prioritet</label>
        <div class="chips" id="f-prio">
          ${prios.map((p)=>`<button class="chip p" data-p="${escapeHtml(p)}">${escapeHtml(PRIO[p]?.label || p)}</button>`).join("")}
        </div>
      </div>
    </div>`;

  $("f-name").oninput = (e) => { form.name = e.target.value; updateSave(); };
  $("f-project").onchange = (e) => { form.projectId = e.target.value; };
  $("f-date").onchange = (e) => { form.dedlayn = e.target.value; };
  $("f-status").onchange = (e) => { form.status = e.target.value; };
  $("f-people").querySelectorAll(".chip").forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.id;
      const i = form.designerIds.indexOf(id);
      if (i >= 0) form.designerIds.splice(i, 1); else form.designerIds.push(id);
      el.classList.toggle("on", i < 0);
      hapticSelect();
    };
  });
  $("f-prio").querySelectorAll(".chip").forEach((el) => {
    el.onclick = () => {
      const p = el.dataset.p;
      const on = form.prioritet === p;
      form.prioritet = on ? "" : p;
      $("f-prio").querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
      if (!on) el.classList.add("on");
      hapticSelect();
    };
  });
  updateSave();
}

function updateSave() { $("c-save").disabled = !form.name.trim(); }

$("c-save").onclick = async () => {
  if (!form.name.trim()) return;
  const btn = $("c-save");
  btn.disabled = true; btn.textContent = "Saqlanmoqda…";
  try {
    const res = await api("/api/tasks", { method: "POST", body: {
      name: form.name.trim(),
      projectId: form.projectId || null,
      designerIds: form.designerIds,
      dedlayn: form.dedlayn || null,
      prioritet: form.prioritet || null,
      status: form.status || null,
    }});
    hapticNotify("success");
    closePage("create");
    toast("Vazifa yaratildi");
    // Ehtiyot chorasi: ayni paytda board qayta yuklangan bo'lsa, ikki nusxa paydo bo'lmasin
    if (!boardData.tasks.some((t) => t.id === res.task.id)) boardData.tasks.unshift(res.task);
    rebuildBoard();
    renderNav();
  } catch (err) {
    hapticNotify("error");
    toast(err.message || "Saqlab bo'lmadi", true);
  } finally {
    btn.disabled = false; btn.textContent = "Saqlash";
    updateSave();
  }
};

/* ==================== Start ==================== */
document.querySelectorAll(".nav-item").forEach((b) => { b.onclick = () => setNav(b.dataset.nav); });
loadData(false);
</script>
</body>
</html>
