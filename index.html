<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Creative Dprt</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181b;
    --surface-2: #212125;
    --border: #2a2a2f;
    --text: #f2f2f0;
    --text-dim: #9a9a9f;
    --accent: #c8f04d;
    --accent-text: #1a1a10;

    --col-draft: #6b6b70;
    --col-goya: #a875e8;
    --col-tasdiq: #e0b93c;
    --col-dizayn: #4d8fe0;
    --col-artdir: #b5773f;
    --col-mijoz: #e0629b;
    --col-finish: #4caf6e;
    --col-archive: #4a4a4f;

    --prio-urgent: #e05c4d;
    --prio-high: #e0b93c;
    --prio-normal: #4d8fe0;

    --overdue: #e05c4d;
    --nav-h: 68px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    min-height: 100vh;
    padding-bottom: var(--nav-h);
  }

  /* ---------- Umumiy header ---------- */
  .page-header {
    padding: 18px 18px 10px;
  }
  .page-header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.02em;
  }
  .page-header .subtitle {
    font-size: 13.5px;
    color: var(--text-dim);
    margin: 0;
  }

  /* ---------- Loading / error / empty ---------- */
  .state-msg {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    padding: 48px 24px; text-align: center;
    color: var(--text-dim); font-size: 14px;
  }
  .state-msg.error { color: var(--overdue); }
  .spinner {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Gorizontal kalendar (Home) ---------- */
  .cal-strip {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 8px 18px 14px; scrollbar-width: none;
    scroll-snap-type: x proximity;
  }
  .cal-strip::-webkit-scrollbar { display: none; }
  .cal-day {
    flex: 0 0 auto; width: 52px; height: 68px;
    border-radius: 14px; background: var(--surface);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; scroll-snap-align: center; cursor: pointer;
    transition: background 0.15s;
  }
  .cal-day .dow { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
  .cal-day .dnum { font-size: 17px; font-weight: 600; }
  .cal-day .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cal-day .cal-dot.hidden { visibility: hidden; }
  .cal-day.active {
    background: var(--accent); border-color: var(--accent);
  }
  .cal-day.active .dow,
  .cal-day.active .dnum { color: var(--accent-text); }
  .cal-day.active .cal-dot { background: var(--accent-text); }
  .cal-day.today:not(.active) .dnum { color: var(--accent); }

  /* ---------- Bo'lim sarlavhasi (Home ish ro'yxatlari) ---------- */
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 16px 18px 8px;
  }
  .section-label .badge {
    font-size: 11px; font-weight: 700; padding: 1px 8px;
    border-radius: 10px; background: var(--surface-2); color: var(--text);
  }
  .section-label.overdue-label { color: var(--overdue); }
  .section-label.overdue-label .badge { background: rgba(224,92,77,0.18); color: var(--overdue); }

  /* ---------- Vazifa kartochkasi ---------- */
  .cards-wrap { padding: 0 18px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--status-color, var(--border));
    border-radius: 12px; padding: 13px 15px;
    text-decoration: none; color: inherit; display: block;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 7px;
  }
  .card-title { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .prio {
    flex: 0 0 auto; font-size: 10.5px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; white-space: nowrap;
  }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 12.5px; color: var(--text-dim); }
  .card-meta .item { display: flex; align-items: center; gap: 4px; }
  .card-meta .status-pill {
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 8px;
    color: var(--status-color); background: color-mix(in srgb, var(--status-color) 15%, transparent);
  }
  .card-meta .deadline.overdue { color: var(--overdue); font-weight: 600; }

  /* ---------- Vazifalar (Kanban tab) ---------- */
  #tabs { display: flex; overflow-x: auto; gap: 6px; padding: 10px 18px 12px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 20px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .tab.active { background: var(--surface-2); color: var(--text); border-color: currentColor; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .tab .count { font-size: 11px; color: var(--text-dim); background: var(--bg); padding: 1px 6px; border-radius: 10px; }

  /* ---------- Ma'lumot sahifalari (Agentlik / Qo'llanmalar) ---------- */
  .content-body { padding: 4px 18px 20px; line-height: 1.6; }
  .content-body .c-heading {
    font-size: 17px; font-weight: 700; margin: 22px 0 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: -0.01em;
  }
  .content-body .c-heading:first-child { margin-top: 6px; }
  .content-body .c-subheading { font-size: 14px; font-weight: 600; color: var(--accent); margin: 16px 0 6px; }
  .content-body .c-text { font-size: 14.5px; margin: 0 0 10px; }
  .content-body ul.c-list, .content-body ol.c-numbered { margin: 0 0 12px; padding-left: 20px; }
  .content-body li { font-size: 14px; margin-bottom: 8px; padding-left: 3px; }
  .content-body ul.c-list li::marker { color: var(--accent); }
  .content-body .c-note {
    font-size: 13.5px; color: var(--text-dim); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 12px 0 4px;
  }

  /* Agentlik ichki tab'lari */
  #subtabs { display: flex; overflow-x: auto; gap: 6px; padding: 6px 18px 12px; scrollbar-width: none; }
  #subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 18px; font-size: 12.5px; font-weight: 500;
    white-space: nowrap; background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
  }
  .subtab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* ---------- Pastki navigatsiya ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
    background: rgba(20,20,23,0.92); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 50;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-dim); font-size: 11px; cursor: pointer; background: none; border: none;
    padding: 8px 0;
  }
  .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .nav-item.active { color: var(--accent); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="page-header">
    <h1 id="header-title">Creative Dprt</h1>
    <p class="subtitle" id="header-subtitle">Yuklanmoqda...</p>
  </div>
  <div id="view"></div>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <button class="nav-item active" data-nav="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
    Home
  </button>
  <button class="nav-item" data-nav="tasks">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    Vazifalar
  </button>
  <button class="nav-item" data-nav="agency">
    <svg viewBox="0 0 24 24"><path d="M4 21V6l7-3 7 3v15"/><path d="M9 21v-5h4v5M4 21h16"/></svg>
    Agentlik
  </button>
  <button class="nav-item" data-nav="guides">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h12"/></svg>
    Qo'llanma
  </button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const STATUS_META = {
  "Draft":          { label: "Draft",          color: "var(--col-draft)" },
  "G'oya kerak":    { label: "G'oya kerak",    color: "var(--col-goya)" },
  "Tasdiqlanyapti": { label: "Tasdiqlanyapti", color: "var(--col-tasdiq)" },
  "Dizaynda":       { label: "Dizaynda",       color: "var(--col-dizayn)" },
  "Art direktorda": { label: "Art direktorda", color: "var(--col-artdir)" },
  "Mijozda":        { label: "Mijozda",        color: "var(--col-mijoz)" },
  "Finish":         { label: "Finish",         color: "var(--col-finish)" },
  "Archive":        { label: "Archive",        color: "var(--col-archive)" },
};
const PRIO_META = {
  "Urgent 🔥": { color: "var(--prio-urgent)", bg: "rgba(224,92,77,0.15)" },
  "High 🥵":   { color: "var(--prio-high)",   bg: "rgba(224,185,60,0.15)" },
  "Normal":    { color: "var(--prio-normal)", bg: "rgba(77,143,224,0.15)" },
};
const DONE_STATUSES = ["Finish", "Archive"];
const DOW = ["Yak", "Dush", "Sesh", "Chor", "Pay", "Jum", "Shan"];

let boardData = null;      // butun ma'lumot (bir marta yuklanadi)
let currentNav = "home";
let selectedDate = null;   // Home'da tanlangan kun (Date)
let currentStatus = null;  // Vazifalar tab'ida tanlangan status

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayMidnight() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function parseDeadline(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTelegramUsername() {
  const u = tg?.initDataUnsafe?.user?.username;
  if (u) return u;
  const params = new URLSearchParams(window.location.search);
  return params.get("username") || "";
}

// ---------- Ma'lumotni bir marta yuklash ----------
async function loadData() {
  const username = getTelegramUsername();
  const viewEl = document.getElementById("view");
  if (!username) {
    viewEl.innerHTML = `<div class="state-msg error">Telegram foydalanuvchi nomi topilmadi. Botni Telegram ilovasi ichida oching.</div>`;
    return;
  }
  viewEl.innerHTML = `<div class="state-msg"><div class="spinner"></div><span>Yuklanmoqda...</span></div>`;
  try {
    const resp = await fetch(`/api/board?username=${encodeURIComponent(username)}`);
    const data = await resp.json();
    if (!resp.ok) {
      viewEl.innerHTML = `<div class="state-msg error">${escapeHtml(data.error || "Xatolik")}</div>`;
      return;
    }
    boardData = data;
    selectedDate = todayMidnight();
    renderNav();
  } catch (err) {
    viewEl.innerHTML = `<div class="state-msg error">Ulanishda xatolik: ${escapeHtml(err.message)}</div>`;
  }
}

// ---------- Navigatsiya ----------
function setNav(nav) {
  currentNav = nav;
  document.querySelectorAll(".nav-item").forEach((b) => {
    b.classList.toggle("active", b.dataset.nav === nav);
  });
  renderNav();
}
function renderNav() {
  if (currentNav === "home") renderHome();
  else if (currentNav === "tasks") renderTasks();
  else if (currentNav === "agency") renderAgency();
  else if (currentNav === "guides") renderGuides();
}

// ---------- HOME ----------
function renderHome() {
  document.getElementById("header-title").textContent = `Salom, ${boardData.requester.name}`;
  document.getElementById("header-subtitle").textContent = boardData.requester.isManager
    ? "Barcha dizaynerlar" : "Bugungi ishlaringiz";

  const today = todayMidnight();

  // Kalendar: bugundan boshlab 21 kun
  let calHtml = `<div class="cal-strip" id="cal-strip">`;
  for (let i = 0; i < 21; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const isActive = ymd(d) === ymd(selectedDate);
    const isToday = ymd(d) === ymd(today);
    // shu kunда dedlayni bor ish bormi?
    const hasTask = boardData.tasks.some((t) => {
      const dl = parseDeadline(t.dedlayn);
      return dl && ymd(dl) === ymd(d) && !DONE_STATUSES.includes(t.status);
    });
    calHtml += `
      <div class="cal-day ${isActive ? "active" : ""} ${isToday ? "today" : ""}" data-date="${ymd(d)}">
        <span class="dow">${DOW[d.getDay()]}</span>
        <span class="dnum">${d.getDate()}</span>
        <span class="cal-dot ${hasTask ? "" : "hidden"}"></span>
      </div>`;
  }
  calHtml += `</div>`;

  // Kechikayotgan ishlar (dedlayni bugundan oldin, tugamagan)
  const overdue = boardData.tasks.filter((t) => {
    const dl = parseDeadline(t.dedlayn);
    return dl && dl < today && !DONE_STATUSES.includes(t.status);
  }).sort((a, b) => parseDeadline(a.dedlayn) - parseDeadline(b.dedlayn));

  // Tanlangan kun ishlari (dedlayni aynan o'sha kun, tugamagan)
  const dayTasks = boardData.tasks.filter((t) => {
    const dl = parseDeadline(t.dedlayn);
    return dl && ymd(dl) === ymd(selectedDate) && !DONE_STATUSES.includes(t.status);
  });

  const isToday = ymd(selectedDate) === ymd(today);
  const dayLabel = isToday ? "Bugun" : selectedDate.toLocaleDateString("uz-UZ", { day: "numeric", month: "long" });

  let html = calHtml;

  // Kechikayotganlar faqat bugun tanlanganda ko'rsatiladi (chalkashmaslik uchun)
  if (isToday && overdue.length > 0) {
    html += `<div class="section-label overdue-label">Kechikayotgan ishlar <span class="badge">${overdue.length}</span></div>`;
    html += `<div class="cards-wrap">` + overdue.map((t) => taskCardHtml(t, true)).join("") + `</div>`;
  }

  html += `<div class="section-label">${escapeHtml(dayLabel)} ishlari <span class="badge">${dayTasks.length}</span></div>`;
  if (dayTasks.length > 0) {
    html += `<div class="cards-wrap">` + dayTasks.map((t) => taskCardHtml(t, false)).join("") + `</div>`;
  } else {
    html += `<div class="state-msg">Bu kunда dedlayni bor ish yo'q</div>`;
  }

  document.getElementById("view").innerHTML = html;

  // Kalendar kunlarини bosish
  document.querySelectorAll(".cal-day").forEach((el) => {
    el.onclick = () => {
      const [y, m, dd] = el.dataset.date.split("-").map(Number);
      selectedDate = new Date(y, m - 1, dd);
      renderHome();
    };
  });
}

// Vazifa kartochkasi (showStatus: kechikayotganlar uchun status ko'rsatiladi)
function taskCardHtml(task, showStatus) {
  const meta = STATUS_META[task.status] || { color: "var(--border)" };
  const dl = parseDeadline(task.dedlayn);
  const today = todayMidnight();
  const isOverdue = dl && dl < today;
  const prioMeta = task.prioritet ? PRIO_META[task.prioritet] : null;

  let dlText = "";
  if (dl) {
    dlText = dl.toLocaleDateString("uz-UZ", { day: "numeric", month: "short" });
  }

  const parts = [];
  if (showStatus) {
    parts.push(`<span class="status-pill">${escapeHtml(task.status)}</span>`);
  }
  if (task.projectName) parts.push(`<span class="item">📁 ${escapeHtml(task.projectName)}</span>`);
  if (dlText) parts.push(`<span class="item deadline ${isOverdue ? "overdue" : ""}">📅 ${dlText}</span>`);
  if (boardData.requester.isManager && task.designers.length) {
    parts.push(`<span class="item">👤 ${task.designers.map((d) => escapeHtml(d.name)).join(", ")}</span>`);
  }

  return `<a class="card" href="${escapeHtml(task.url)}" target="_blank" style="--status-color:${meta.color}">
    <div class="card-top">
      <div class="card-title">${escapeHtml(task.name)}</div>
      ${task.prioritet ? `<div class="prio" style="color:${prioMeta.color};background:${prioMeta.bg}">${escapeHtml(task.prioritet)}</div>` : ""}
    </div>
    <div class="card-meta">${parts.join("")}</div>
  </a>`;
}

// ---------- VAZIFALAR (Kanban) ----------
function renderTasks() {
  document.getElementById("header-title").textContent = "Vazifalar";
  document.getElementById("header-subtitle").textContent = boardData.requester.isManager
    ? "Barcha dizaynerlar" : "Sizning vazifalaringiz";

  const statusesWithData = boardData.statusOrder.filter((s) => boardData.board[s]?.length > 0);
  const toShow = statusesWithData.length ? statusesWithData : boardData.statusOrder;
  if (!currentStatus || !toShow.includes(currentStatus)) currentStatus = toShow[0];

  let html = `<div id="tabs">`;
  for (const s of toShow) {
    const meta = STATUS_META[s] || { label: s, color: "var(--border)" };
    const count = boardData.board[s]?.length || 0;
    html += `<div class="tab ${s === currentStatus ? "active" : ""}" style="color:${meta.color}" data-status="${escapeHtml(s)}">
      <span class="dot" style="background:${meta.color}"></span>${escapeHtml(meta.label)}<span class="count">${count}</span>
    </div>`;
  }
  html += `</div><div id="task-cards"></div>`;
  document.getElementById("view").innerHTML = html;

  document.querySelectorAll(".tab").forEach((el) => {
    el.onclick = () => { currentStatus = el.dataset.status; renderTasks(); };
  });
  renderTaskCards();
}
function renderTaskCards() {
  const el = document.getElementById("task-cards");
  const tasks = boardData.board[currentStatus] || [];
  if (!tasks.length) { el.innerHTML = `<div class="state-msg">Bu bosqichda vazifalar yo'q</div>`; return; }
  el.innerHTML = `<div class="cards-wrap">` + tasks.map((t) => taskCardHtml(t, false)).join("") + `</div>`;
}

// ---------- AGENTLIK (ichki tab'lar) ----------
const AGENCY_TABS = [
  { key: "about", label: "Agentlik haqida" },
  { key: "workflow", label: "Ish jarayonlari" },
  { key: "roles", label: "Kim nima qiladi" },
];
let currentAgencyTab = "about";

function renderAgency() {
  document.getElementById("header-title").textContent = "Agentlik";
  document.getElementById("header-subtitle").textContent = "Creative Dprt";

  let html = `<div id="subtabs">`;
  for (const t of AGENCY_TABS) {
    html += `<div class="subtab ${t.key === currentAgencyTab ? "active" : ""}" data-key="${t.key}">${escapeHtml(t.label)}</div>`;
  }
  html += `</div><div id="agency-content"><div class="state-msg"><div class="spinner"></div></div></div>`;
  document.getElementById("view").innerHTML = html;

  document.querySelectorAll(".subtab").forEach((el) => {
    el.onclick = () => { currentAgencyTab = el.dataset.key; renderAgency(); };
  });
  loadContent(currentAgencyTab, "agency-content");
}

// ---------- QO'LLANMALAR ----------
function renderGuides() {
  document.getElementById("header-title").textContent = "Qo'llanmalar";
  document.getElementById("header-subtitle").textContent = "Creative Dprt";
  document.getElementById("view").innerHTML = `<div id="guides-content"><div class="state-msg"><div class="spinner"></div></div></div>`;
  loadContent("guides", "guides-content");
}

// Ma'lumot sahifasini yuklab, HTML'ga aylantirish
async function loadContent(pageKey, targetId) {
  try {
    const resp = await fetch(`/api/content/${pageKey}`);
    const data = await resp.json();
    const el = document.getElementById(targetId);
    if (!el) return;
    if (!resp.ok) { el.innerHTML = `<div class="state-msg error">${escapeHtml(data.error || "Topilmadi")}</div>`; return; }
    el.innerHTML = `<div class="content-body">` + data.sections.map(renderSection).join("") + `</div>`;
  } catch (err) {
    const el = document.getElementById(targetId);
    if (el) el.innerHTML = `<div class="state-msg error">Xatolik: ${escapeHtml(err.message)}</div>`;
  }
}
function renderSection(s) {
  switch (s.type) {
    case "heading": return `<div class="c-heading">${escapeHtml(s.text)}</div>`;
    case "subheading": return `<div class="c-subheading">${escapeHtml(s.text)}</div>`;
    case "text": return `<p class="c-text">${escapeHtml(s.text)}</p>`;
    case "note": return `<div class="c-note">${escapeHtml(s.text)}</div>`;
    case "list": return `<ul class="c-list">${s.items.map((i) => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
    case "numbered": return `<ol class="c-numbered">${s.items.map((i) => `<li>${escapeHtml(i)}</li>`).join("")}</ol>`;
    default: return "";
  }
}

// ---------- Ishga tushirish ----------
document.querySelectorAll(".nav-item").forEach((b) => {
  b.onclick = () => setNav(b.dataset.nav);
});
loadData();
</script>
